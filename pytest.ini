[pytest]
# Permite importar "pages" y "utils" desde cualquier test sin hacks de sys.path
pythonpath = .
testpaths = tests
# Cada ejecución genera el reporte HTML con todo embebido (estilos + capturas)
addopts = -v --html=reports/reporte.html --self-contained-html
markers =
    ui: pruebas de interfaz de usuario con Selenium (saucedemo.com)
    api: pruebas de API con requests (JSONPlaceholder)
